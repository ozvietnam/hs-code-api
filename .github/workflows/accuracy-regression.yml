name: Accuracy regression (no LLM)

# Chấm tầng tìm kiếm deterministic trên tập giữ riêng (763 tờ khai) — không
# cần key LLM. Đỏ khi top-1/top-3 ở mức 4 hoặc 8 số tụt quá 1 điểm % so với
# mốc data/alias-benchmark-latest.json. Mất ~8 phút nên chạy riêng.
on:
  pull_request:
  push:
    branches: [main]

# Huỷ lượt của SHA cũ khi có push mới, chừa main để giữ dấu xanh commit đã gộp
# (OZV-355). Cổng giữ: scripts/test-ci-concurrency.mjs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hồi quy bộ 50 ca TB-TCHQ (no LLM)
        run: node scripts/benchmark-50-ca-tb-tchq.mjs --gate
      - name: Hồi quy tập giữ riêng 763 tờ khai (no LLM)
        run: node scripts/benchmark-alias-holdout.mjs --gate
