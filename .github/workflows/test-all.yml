name: Full test suite

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund   # devDependency xlsx cho scripts/test-bieu-thue.mjs
        env:
          # onnxruntime-node (qua @huggingface/transformers) postinstall tải gói CUDA từ api.nuget.org — runner
          # timeout thất thường (23/10, PR #424). CI không cần CUDA: bỏ qua phần không đóng gói sẵn.
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test
