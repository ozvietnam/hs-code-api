name: Full test suite

on:
  # KHÔNG thêm nhánh thợ ('claude/**', 'ozv-*') vào đây: nhánh thợ đều có PR nên
  # `pull_request` đã phủ, bắt thêm `push` là sinh 2 lượt y hệt nhau cho cùng một
  # SHA — đo lúc 00:30 VN 12/11/2026: 44/154 lượt trong hàng là rác thuần kiểu này
  # (OZV-355). Giữ `main` vì cần dấu xanh trên main cho số đo "main xanh".
  push:
    branches: [main]
  pull_request:

# Push mới huỷ lượt của SHA cũ trên cùng nhánh/PR (trước đây nhánh claude/duyet-L31
# có 3 SHA cùng nằm trong hàng, 2/3 là rác). Mẫu dùng lại từ ozplugin/.github/
# workflows/ci.yml + erp-xnk. Chừa main: tự huỷ lượt của commit đã gộp là mất dấu
# xanh ⇒ hỏng số đo "main xanh". Cổng giữ: scripts/test-ci-concurrency.mjs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `--include=dev` phải ghi TƯỜNG MINH: nếu môi trường chạy có `NODE_ENV=production` thì npm tự bật
      # `omit=dev` và BỎ HẾT devDependencies (xlsx, pdf-parse, @electric-sql/pglite) mà vẫn thoát 0 —
      # test-bieu-thue.mjs chết với `Cannot find module 'xlsx'` trông như "máy thiếu gói" (OZV-272).
      - run: npm ci --include=dev --no-audit --no-fund
        env:
          # onnxruntime-node (qua @huggingface/transformers) postinstall tải gói CUDA từ api.nuget.org — runner
          # timeout thất thường (23/10, PR #424). CI không cần CUDA: bỏ qua phần không đóng gói sẵn.
          ONNXRUNTIME_NODE_INSTALL: skip
      # Bộ kiểm có gói dev thật, không rơi vào bẫy trên.
      - run: node -e "require('xlsx'); require('pdf-parse'); console.log('dev deps OK')"
      # Lưu log + `EXIT=` rồi chấm bằng máy: chỉ tin "xanh" khi có ĐỦ số ca test và EXIT=0 (OZV-272).
      - run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          ma=$?
          echo "EXIT=$ma" >> /tmp/npm-test.log
          tail -200 /tmp/npm-test.log
          exit $ma
        shell: bash
      - run: node scripts/dem-ca-test.mjs /tmp/npm-test.log
        if: always()
