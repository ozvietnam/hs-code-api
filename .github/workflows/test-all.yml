name: Full test suite

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund   # devDependency xlsx cho scripts/test-bieu-thue.mjs
      - run: npm test
