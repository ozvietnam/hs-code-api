name: community-data

# Kiểm mọi đóng góp dữ liệu TRƯỚC khi merge.
# Quan trọng nhất là bộ lọc riêng tư: repo công khai, lịch sử git không xoá được,
# nên một lần lọt thông tin khách hàng là vĩnh viễn.
on:
  pull_request:
    paths:
      - 'data/community/**'
      - 'data/precedents.json'
      - 'schemas/**'
      - 'scripts/validate-community.mjs'
  push:
    branches: [main]
    paths:
      - 'data/community/**'
      - 'data/precedents.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm schema + lọc thông tin khách hàng
        run: node scripts/validate-community.mjs

  # Bug tìm thấy ở PR #293: mất 20 hsCode keys, 53 records do agent tự rebase
  precedents-coverage:
    name: "Đảm bảo precedents.json không mất hsCode keys"
    runs-on: ubuntu-latest
    # Chỉ chạy trên PR. Trigger paths ở cấp workflow đã lọc sẵn (data/**, schemas/**,
    # validate-community) — hễ job này chạy tức là có đụng dữ liệu, nên chạy guard
    # không cần điều kiện thêm. (Điều kiện cũ dùng changed_files — vốn là SỐ ĐẾM tệp,
    # không phải danh sách đường dẫn — nên contains() luôn false, job chết lặng.)
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backup baseline
        run: |
          mkdir -p .backups
          if ! cp data/precedents.json .backups/precedents-baseline.json; then
            echo "::error::Failed to backup precedents.json as baseline"
            exit 1
          fi
          test -s .backups/precedents-baseline.json || (echo "::error::Baseline is empty"; exit 1)
      - name: Verify không mất hsCode
        run: |
          node scripts/ci-check-precedents-coverage.mjs --baseline .backups/precedents-baseline.json

  # Bug tìm thấy ở PR #293: 53 records trong community không có trong precedents
  community-vs-precedents:
    name: "Đảm bảo tất cả records trong community có trong precedents"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify community ↔ precedents consistency
        run: node scripts/ci-check-community-vs-precedents.mjs

  dco:
    runs-on: ubuntu-latest
    # CHỈ áp cho PR đến từ fork, tức người đóng góp BÊN NGOÀI.
    # Mục đích của DCO là ghi nhận việc người đóng góp cấp quyền cho dự án —
    # chủ sở hữu bản quyền không cần tự cấp phép cho chính mình. Nhánh nội bộ
    # trong repo đã thuộc quyền chủ dự án nên không cần ký.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kiểm chữ ký DCO (Signed-off-by)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::Commit $sha thiếu Signed-off-by"
              git log -1 --format='  %h %s' "$sha"
              missing=1
            fi
          done < <(git rev-list "$base".."$head")
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Mỗi commit phải ký DCO. Sửa bằng:  git commit --amend -s"
            echo "Nhiều commit:  git rebase --signoff $base"
            echo "Chi tiết: CONTRIBUTING.md mục 'Ký DCO'"
            exit 1
          fi
          echo "Tất cả commit đã ký DCO."
