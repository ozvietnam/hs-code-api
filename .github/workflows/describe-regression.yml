name: Describe compliance regression

on:
  # `branches: [main]` phải khai tường minh: `push:` trống nhánh là bắt MỌI nhánh,
  # nên mỗi push lên nhánh đang có PR sinh 2 lượt — và hai lượt đó nằm ở hai
  # `concurrency.group` khác tên (`<workflow>-refs/heads/<nhánh>` vs
  # `<workflow>-<số-PR>`) nên concurrency không dọn hộ (OZV-355).
  push:
    branches: [main]
    paths:
      - 'lib/declaration-validator.js'
      - 'lib/customs-prompt.js'
      - 'lib/describe-compose.js'
      - 'api/describe.js'
      - 'data/anti-patterns.json'
      - 'data/chapter-specific-rules.json'
      - 'data/chapter-declaration-fields.json'
      - 'data/heading-declaration-fields.json'
      - 'data/hs-declaration-overrides.json'
      - 'lib/declaration-field-templates.js'
      - 'lib/compliance-data.js'
      - 'tests/describe-cases.json'
      - 'tests/describe-chapter-fields.json'
  pull_request:
    paths:
      - 'lib/declaration-validator.js'
      - 'lib/customs-prompt.js'
      - 'lib/describe-compose.js'
      - 'api/describe.js'
      - 'data/anti-patterns.json'
      - 'data/chapter-specific-rules.json'
      - 'data/chapter-declaration-fields.json'
      - 'data/heading-declaration-fields.json'
      - 'data/hs-declaration-overrides.json'
      - 'lib/declaration-field-templates.js'
      - 'lib/compliance-data.js'
      - 'tests/describe-cases.json'
      - 'tests/describe-chapter-fields.json'

# Huỷ lượt của SHA cũ khi có push mới, chừa main để giữ dấu xanh commit đã gộp
# (OZV-355). Cổng giữ: scripts/test-ci-concurrency.mjs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run test:describe
