name: Search regression

on:
  # `branches: [main]` phải khai tường minh — xem lý do ở describe-regression.yml
  # (`push:` trống nhánh = bắt mọi nhánh ⇒ nhân đôi lượt với `pull_request`, OZV-355).
  push:
    branches: [main]
    paths:
      - 'lib/search-utils.js'
      - 'lib/search-query-expand.js'
      - 'data/brand-product-map.json'
      - 'data/english-product-map.json'
      - 'data/vn-product-synonyms.json'
      - 'tests/search-cases.json'
      - 'data/search.json'
  pull_request:
    paths:
      - 'lib/search-utils.js'
      - 'lib/search-query-expand.js'
      - 'data/brand-product-map.json'
      - 'data/english-product-map.json'
      - 'data/vn-product-synonyms.json'
      - 'tests/search-cases.json'
      - 'data/search.json'

# Huỷ lượt của SHA cũ khi có push mới, chừa main để giữ dấu xanh commit đã gộp
# (OZV-355). Cổng giữ: scripts/test-ci-concurrency.mjs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run test:search
