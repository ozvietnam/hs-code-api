name: plhq-sync

# Cầu nối oz-wiki-plhq → hs-code-api: mỗi ngày (và ngay khi kho cộng đồng báo qua repository_dispatch)
# tải dist/registry.json, đo lại song kiếm, chạy toàn bộ test, rồi:
#   mở/cập nhật PR "auto/plhq-sync" (main được bảo vệ, bắt buộc qua PR), rồi
#   - thay đổi nhỏ  → bot tự gộp PR (dữ liệu chỉ đọc, đã qua cửa duyệt PR của kho cộng đồng + npm test ở đây)
#   - thay đổi lớn  → PR chờ người duyệt (bớt văn bản, hoặc > 10 văn bản đổi tình trạng)
# Cần bật: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# Không đổi gì → không commit. Hạn đối chiếu plhqRegistry trong data-freshness.json được làm mới mỗi tuần.
on:
  schedule:
    - cron: '17 1 * * *' # 08:17 giờ VN
  workflow_dispatch:
  repository_dispatch:
    types: [plhq-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plhq-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Đồng bộ sổ đăng ký
        id: sync
        run: |
          node scripts/sync-plhq.mjs --summary "$RUNNER_TEMP/plhq-summary.md" --touch-freshness | tee "$RUNNER_TEMP/sync.log"
          grep -E '^(CHANGED|LARGE|TOUCHED)=' "$RUNNER_TEMP/sync.log" | tr 'A-Z' 'a-z' >> "$GITHUB_OUTPUT"
      - name: Đo song kiếm
        if: steps.sync.outputs.changed == 'true'
        run: node scripts/bench-plhq.mjs --json > "$RUNNER_TEMP/bench.md"
      - name: Toàn bộ test
        if: steps.sync.outputs.changed == 'true' || steps.sync.outputs.touched == 'true'
        run: npm test
      - name: Commit / mở PR
        if: steps.sync.outputs.changed == 'true' || steps.sync.outputs.touched == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LARGE: ${{ steps.sync.outputs.large }}
        run: |
          git config user.name "plhq-sync[bot]"
          git config user.email "plhq-sync@users.noreply.github.com"
          git add data/plhq-registry.json data/plhq-hs-index.json data/plhq-bench-latest.json data/data-freshness.json 2>/dev/null || git add data/plhq-registry.json data/plhq-bench-latest.json data/data-freshness.json
          git diff --cached --quiet && { echo "Không có gì để commit"; exit 0; }
          MSG="chore(data): đồng bộ sổ văn bản oz-wiki-plhq $(date -u +%F)"
          git commit -q -m "$MSG" -m "$(cat "$RUNNER_TEMP/plhq-summary.md")"
          # main được bảo vệ (bắt buộc qua PR) → luôn đi qua PR auto/plhq-sync.
          git push -f origin HEAD:refs/heads/auto/plhq-sync
          { cat "$RUNNER_TEMP/plhq-summary.md"; echo; echo '<details><summary>Kết quả đo song kiếm</summary>'; echo; cat "$RUNNER_TEMP/bench.md" 2>/dev/null; echo; echo '</details>'; } > "$RUNNER_TEMP/body.md"
          NUM=$(gh pr list --head auto/plhq-sync --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh pr edit "$NUM" --title "$MSG" --body-file "$RUNNER_TEMP/body.md"
          elif ! gh pr create --base main --head auto/plhq-sync --title "$MSG" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::GitHub Actions chưa được phép mở PR. Bật: Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'. Nhánh auto/plhq-sync đã có sẵn — có thể mở PR tay."
            exit 1
          else
            NUM=$(gh pr list --head auto/plhq-sync --state open --json number --jq '.[0].number')
          fi
          # Thay đổi nhỏ: test đã xanh ở bước trên → thử gộp luôn. Ruleset đòi người duyệt / check thì PR chờ người duyệt.
          if [ "$LARGE" != "true" ]; then
            gh pr merge "$NUM" --squash --delete-branch || echo "::notice::PR #$NUM chờ người duyệt (ruleset của main chưa cho bot tự gộp)."
          else
            echo "::notice::Thay đổi lớn — PR #$NUM chờ người duyệt."
          fi
