name: ⚖️ Góp cụm mã dễ nhầm + cách phân biệt
description: Đóng góp giá trị nhất — trực tiếp kéo độ chính xác của hệ thống lên
title: "[conflict] "
labels: ["data", "conflict-table", "ưu tiên cao"]
body:
  - type: markdown
    attributes:
      value: |
        **Đây là đóng góp quý nhất cho dự án.**

        Hệ thống hiện mới có 3 bảng quyết định, phủ 10 trên 11.871 mã. Mỗi bảng
        bạn góp là một cụm mã mà từ nay AI và người tra sẽ không còn nhầm nữa.

        Hãy nghĩ tới những cặp mã mà bạn từng bị Hải quan bác, hoặc phải tranh
        luận mới thông quan được.
  - type: input
    id: cac-ma
    attributes:
      label: Các mã hay nhầm lẫn nhau
      placeholder: "84137090 vs 84133090 vs 84134000"
    validations:
      required: true
  - type: textarea
    id: phan-biet
    attributes:
      label: Dấu hiệu phân biệt
      description: |
        Cần biết **dữ kiện gì** ở hàng hoá thì phân định được? Ví dụ:
        - Bơm dùng cho chất lỏng gì → nước sạch = 8413.70, nhiên liệu = 8413.30
        - Vải dệt kim hay dệt thoi → chương 61 vs 62
      placeholder: |
        Dữ kiện cần biết: ...
        Nếu <dữ kiện> = <giá trị> → mã ...
        Nếu <dữ kiện> = <giá trị> → mã ...
    validations:
      required: true
  - type: textarea
    id: can-cu
    attributes:
      label: Căn cứ
      description: Chú giải chương/nhóm nào, quy tắc GIR nào, hay thông báo TB-TCHQ nào?
    validations:
      required: true
  - type: textarea
    id: kinh-nghiem
    attributes:
      label: Kinh nghiệm thực tế (tuỳ chọn)
      description: Bạn từng bị bác mã ở cụm này chưa? Giải trình thế nào thì được chấp nhận?
  - type: checkboxes
    id: privacy
    attributes:
      label: Xác nhận
      options:
        - label: Nội dung không chứa thông tin khách hàng hay chứng từ
          required: true
        - label: Tôi đồng ý đóng góp này được phát hành theo CC BY-SA 4.0
          required: true
