name: 🐞 Báo lỗi dữ liệu
description: Thuế suất, tên hàng, chính sách hoặc chú giải bị sai
title: "[data] "
labels: ["data", "cần xác minh"]
body:
  - type: markdown
    attributes:
      value: |
        Dữ liệu sai đang lan ra qua API công khai và qua các AI đọc kho này —
        báo lỗi là đóng góp rất giá trị.

        ⚠️ **Đừng dán thông tin khách hàng** (tên doanh nghiệp, MST, số tờ khai,
        trị giá). Chỉ cần mã HS và nội dung sai.
  - type: input
    id: hs
    attributes:
      label: Mã HS liên quan
      placeholder: "84137090"
    validations:
      required: true
  - type: textarea
    id: sai
    attributes:
      label: Đang sai thế nào
      description: Hệ thống đang hiển thị gì
    validations:
      required: true
  - type: textarea
    id: dung
    attributes:
      label: Đúng phải là gì
    validations:
      required: true
  - type: textarea
    id: nguon
    attributes:
      label: Căn cứ
      description: Số hiệu thông tư/thông báo, hoặc link văn bản. Không có nguồn thì dự án không sửa được.
      placeholder: "TT 31/2022/TT-BTC, hoặc 1234/TB-TCHQ"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Xác nhận
      options:
        - label: Nội dung tôi gửi không chứa thông tin khách hàng, số tờ khai hay trị giá lô hàng
          required: true
